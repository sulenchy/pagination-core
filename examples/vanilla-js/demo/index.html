<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagination-core Vanilla JS Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>pagination-core Vanilla JS Demo</h1>

        <div id="items-list" class="items-list">
            This demo shows how to use pagination-core in a vanilla JavaScript application. The pagination instance is created and managed manually, and the UI is updated based on the pagination state changes.
            <!-- Items will be rendered here -->
        </div>

        <div class="pagination-controls">
            <button id="prev-button">Previous</button>
            <div id="page-numbers">
                <!-- Page numbers will be rendered here -->
            </div>
            <button id="next-button">Next</button>
        </div>

        <div class="pagination-info">
            <p>Current Page: <span id="current-page"></span></p>
            <p>Total Pages: <span id="total-pages"></span></p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
